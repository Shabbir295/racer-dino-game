<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }
        .navbar {
            background: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
        }
        .logout-btn {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            padding: 30px;
        }
        .stats {
            display: flex;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            text-align: center;
        }
        .card h1 {
            font-size: 36px;
            margin: 0;
        }
        .game-link {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>Dino Game Admin</h2>
        <div>
            Welcome, {{ session.admin_username }}
            <a href="/admin/logout" class="logout-btn">Logout</a>
        </div>
    </div>
    
    <div class="container">
        <div class="stats">
            <div class="card">
                <h3>Total Users</h3>
                <h1>{{ stats.total_users }}</h1>
            </div>
            <div class="card">
                <h3>Active Today</h3>
                <h1>{{ stats.active_users }}</h1>
            </div>
            <div class="card">
                <h3>Games Played</h3>
                <h1>{{ stats.total_games }}</h1>
            </div>
        </div>
        
        <div class="game-link">
            <a href="/">🎮 Play Dino Game →</a>
        </div>
    </div>
</body>
</html>
